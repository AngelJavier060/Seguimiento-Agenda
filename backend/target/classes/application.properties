# ── DATABASE ──────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5434/agenda_db
spring.datasource.username=agenda_user
spring.datasource.password=agenda_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / HIBERNATE ───────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── SERVER ────────────────────────────────────────────────
server.port=8081

# ── APP ───────────────────────────────────────────────────
app.name=Agenda de Cumplimiento
spring.application.name=agenda-backend

