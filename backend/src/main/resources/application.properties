# ── DATABASE ──────────────────────────────────────────────
# Valores para desarrollo local. En producción Docker los sobrescribe
# automáticamente con variables SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, etc.
spring.datasource.url=jdbc:postgresql://localhost:5434/agenda_db
spring.datasource.username=agenda_user
spring.datasource.password=agenda_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / HIBERNATE ───────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── SERVER ────────────────────────────────────────────────
server.port=8081

# ── APP ───────────────────────────────────────────────────
app.name=Agenda de Cumplimiento
spring.application.name=agenda-backend

# URL pública del frontend (para incluir links en notificaciones)
app.public.url=${APP_PUBLIC_URL:}

# ── N8N (webhook para notificaciones) ─────────────────────
n8n.webhook.url=${N8N_WEBHOOK_URL:}

# ── JWT ───────────────────────────────────────────────────
security.jwt.expiration-ms=28800000

# ── TELEGRAM (configurar en prod via env vars) ────────────
